<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoSoft - Nueva contraseña</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <style>
    .login-card { max-width: 430px; }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="login-card">
  <div class="login-brand">
    <span class="material-symbols-outlined">dentistry</span>
    <h1>Odonto<span>Soft</span></h1>
  </div>
  <p class="login-subtitle">Crea tu nueva contraseña</p>

  <form id="resetForm" novalidate>
    <div class="form-group password-group">
      <label>Nueva contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="inPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
        <span class="material-symbols-outlined toggle-password" onclick="togglePassword('inPassword')">
          visibility_off
        </span>
      </div>
    </div>

    <div class="form-group password-group">
      <label>Confirmar contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="inPassword2" placeholder="Repite la contraseña" required minlength="6">
        <span class="material-symbols-outlined toggle-password" onclick="togglePassword('inPassword2')">
          visibility_off
        </span>
      </div>
    </div>

    <button type="submit" class="btn-primary" id="btnReset">
      <span class="material-symbols-outlined">lock_reset</span> Guardar nueva contraseña
    </button>
  </form>

  <p class="link-login">
    <a href="login.html">← Volver a iniciar sesión</a>
  </p>
</div>

<script>
  const API_BASE = "http://127.0.0.1:8000";

  function togglePassword(id) {
    const input = document.getElementById(id);
    const icon = input.nextElementSibling;
    if (input.type === "password") {
      input.type = "text";
      icon.textContent = "visibility";
    } else {
      input.type = "password";
      icon.textContent = "visibility_off";
    }
  }

  function toast(msg, tipo = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `toast show ${tipo}`;
    setTimeout(() => t.classList.remove("show"), 4000);
  }

  // Extraer el token de la URL: reset-password.html?token=xxxxx
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    toast('❌ Enlace inválido o incompleto. Solicita uno nuevo.', 'error');
    document.getElementById('resetForm').style.display = 'none';
  }

  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const pass1 = document.getElementById('inPassword').value;
    const pass2 = document.getElementById('inPassword2').value;
    const btn = document.getElementById('btnReset');

    if (pass1.length < 6) {
      toast('🔑 La contraseña debe tener al menos 6 caracteres', 'warning');
      return;
    }

    if (pass1 !== pass2) {
      toast('❌ Las contraseñas no coinciden', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined spinner">progress_activity</span> Guardando...`;

    try {
      const response = await fetch(`${API_BASE}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, nueva_contrasena: pass1 })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.detail || `Error ${response.status}`);
      }

      toast(`✅ ${data.mensaje}`, 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);

    } catch (error) {
      let mensajeError = error.message || 'Ocurrió un error inesperado.';
      if (mensajeError.includes('Failed to fetch')) {
        mensajeError = '❌ No se pudo conectar con el servidor. Verifica que el backend esté corriendo.';
      }
      toast(mensajeError, 'error');
      btn.disabled = false;
      btn.innerHTML = `<span class="material-symbols-outlined">lock_reset</span> Guardar nueva contraseña`;
    }
  });
</script>

</body>
</html>
